# Nginx (cài trên VPS) đứng trước LeadScan: nhận 80/443 rồi chuyển vào 2 container.
#   /api/*  → FastAPI   127.0.0.1:8012  (API_PORT trong .env)
#   còn lại → Next.js   127.0.0.1:3012  (WEB_PORT trong .env)
#
# Cài đặt (xem README, mục "Deploy lên VPS"):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/leadscan.conf
#   sudo ln -s /etc/nginx/sites-available/leadscan.conf /etc/nginx/sites-enabled/leadscan.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d leadscan.net   # tự thêm HTTPS + chuyển hướng 80 → 443
#
# Đổi tên miền: sửa server_name. Đổi cổng: sửa 2 upstream cho khớp API_PORT / WEB_PORT.

upstream leadscan_api {
    server 127.0.0.1:8012;
    keepalive 16;
}

upstream leadscan_web {
    server 127.0.0.1:3012;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name leadscan.net;

    server_tokens off;

    # HSTS chỉ có tác dụng qua HTTPS (trình duyệt bỏ qua header này trên HTTP),
    # nên để sẵn ở đây là an toàn; sau khi certbot chạy nó áp dụng cho khối 443.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # Header gửi vào backend. X-Real-IP LUÔN bị ghi đè bằng IP thật của kết nối,
    # khách không giả mạo được → backend dùng để giới hạn đăng ký / đăng nhập sai theo IP.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Form ứng tuyển kèm file CV (≤ 5 MB, gửi dạng base64 trong JSON) → nới giới hạn body riêng cho endpoint này
    location ~ ^/api/jobs/[^/]+/apply$ {
        client_max_body_size 8m;
        proxy_read_timeout 60s;
        proxy_pass http://leadscan_api;
    }

    # API → FastAPI. Body nhỏ (form, JSON) — chặn upload lớn ngay tại Nginx.
    location /api/ {
        client_max_body_size 64k;
        proxy_read_timeout 60s;
        proxy_pass http://leadscan_api;
    }

    # Còn lại → Next.js (landing, /admin, /thanh-vien)
    location / {
        client_max_body_size 1m;
        proxy_pass http://leadscan_web;
    }
}

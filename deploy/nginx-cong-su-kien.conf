# Nginx cho 2 cổng sự kiện: c89.leadscan.net (CLB CEO 1989) và epc.leadscan.net (EPC).
#   /api/*  → FastAPI dùng chung   127.0.0.1:8012  (upstream leadscan_api khai báo trong deploy/nginx.conf)
#   còn lại → container web của cổng: web-c89 127.0.0.1:3013 (C89_PORT), web-epc 127.0.0.1:3014 (EPC_PORT)
#
# Mỗi khối server đặt header X-LeadScan-Site (ghi đè giá trị khách gửi) → backend biết request thuộc cổng nào.
#
# Cài đặt (DNS: trỏ bản ghi A của c89.leadscan.net và epc.leadscan.net về IP VPS trước):
#   sudo cp deploy/nginx-cong-su-kien.conf /etc/nginx/sites-available/leadscan-cong-su-kien.conf
#   sudo ln -s /etc/nginx/sites-available/leadscan-cong-su-kien.conf /etc/nginx/sites-enabled/leadscan-cong-su-kien.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d c89.leadscan.net -d epc.leadscan.net   # HTTPS + chuyển hướng 80 → 443
#
# Đổi cổng: sửa 2 upstream dưới cho khớp C89_PORT / EPC_PORT trong .env.

upstream leadscan_web_c89 {
    server 127.0.0.1:3013;
    keepalive 16;
}

upstream leadscan_web_epc {
    server 127.0.0.1:3014;
    keepalive 16;
}

# ------------------------------------------------------------------ c89.leadscan.net
server {
    listen 80;
    listen [::]:80;
    server_name c89.leadscan.net;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-LeadScan-Site c89;

    # Đăng ký kèm profile PDF / ảnh chuyển khoản (≤ 20 MB, base64 → ~26,7 MB)
    location ~ ^/api/events/[^/]+/register$ {
        client_max_body_size 30m;
        client_body_timeout 120s;
        proxy_read_timeout 180s;
        proxy_pass http://leadscan_api;
    }
    location ~ ^/api/events/registrations/[^/]+/proof$ {
        client_max_body_size 30m;
        client_body_timeout 120s;
        proxy_read_timeout 180s;
        proxy_pass http://leadscan_api;
    }
    location ~ ^/api/admin/event-registrations/[0-9]+/recheck$ {
        client_max_body_size 64k;
        proxy_read_timeout 120s;
        proxy_pass http://leadscan_api;
    }

    location /api/ {
        client_max_body_size 64k;
        proxy_read_timeout 60s;
        proxy_pass http://leadscan_api;
    }

    location / {
        client_max_body_size 1m;
        proxy_pass http://leadscan_web_c89;
    }
}


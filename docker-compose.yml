# LeadScan B2B — toàn bộ hệ thống trên 1 VPS.
#   cp .env.example .env   # điền mật khẩu DB, tên miền, email
#   docker compose up -d --build
# Nginx cài trên VPS (deploy/nginx.conf + deploy/nginx-cong-su-kien.conf) nhận 80/443 rồi chuyển vào api / web / web-c89 / web-epc.
# api và các container web chỉ mở cổng trên 127.0.0.1 nên bên ngoài không truy cập thẳng được;
# db/redis/worker không mở cổng nào, chỉ nói chuyện trong mạng nội bộ của Docker.

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  env_file: .env
  environment:
    LEADSCAN_DATABASE_URL: postgresql+psycopg://leadscan:${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}@db:5432/leadscan
    LEADSCAN_REDIS_URL: redis://redis:6379/0
    LEADSCAN_CLIENT_IP_HEADER: X-Real-IP
    LEADSCAN_ENRICH_RAW_DIR: /data/enrich-raw  # bản gốc làm giàu MST (khi chưa cấu hình R2)
  volumes:
    - enrichraw:/data/enrich-raw
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

x-web: &web
  build:
    context: ./web
    args:
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://leadscan.net}
      NEXT_PUBLIC_C89_URL: ${C89_URL:-https://c89.leadscan.net}
      NEXT_PUBLIC_EPC_URL: ${EPC_URL:-https://epc.leadscan.net}
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      NEXT_PUBLIC_BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
      NEXT_PUBLIC_GA_ID: ${GA_MEASUREMENT_ID:-}
      API_INTERNAL_URL: http://api:8000
  image: leadscan-web:latest  # build 1 lần, 3 container dùng chung
  restart: unless-stopped
  depends_on:
    - api

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: leadscan
      POSTGRES_USER: leadscan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadscan -d leadscan"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Chạy migration 1 lần mỗi lần deploy, xong thì thoát
  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8012}:8000"  # chỉ localhost — Nginx gọi vào /api/
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker", "worker", "-l", "info", "--concurrency", "2"]

  beat:
    <<: *backend
    command: ["celery", "-A", "app.worker", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]

  # 3 container web chạy CÙNG 1 image, khác biến SITE: leadscan.net (web), c89.leadscan.net (web-c89),
  # epc.leadscan.net (web-epc). Cổng sự kiện chỉ có trang sự kiện + trang quản trị sự kiện (web/proxy.ts).
  web:
    <<: *web
    ports:
      - "127.0.0.1:${WEB_PORT:-3012}:3000"  # chỉ localhost — Nginx gọi vào /

  web-c89:
    <<: *web
    environment:
      SITE: c89
    ports:
      - "127.0.0.1:${C89_PORT:-3013}:3000"  # c89.leadscan.net (deploy/nginx-cong-su-kien.conf)

  web-epc:
    <<: *web
    environment:
      SITE: epc
    ports:
      - "127.0.0.1:${EPC_PORT:-3014}:3000"  # epc.leadscan.net (deploy/nginx-cong-su-kien.conf)

volumes:
  pgdata:
  redisdata:
  enrichraw:

# LeadScan B2B — toàn bộ hệ thống trên 1 VPS.
#   cp .env.example .env   # điền mật khẩu DB, tên miền, email
#   docker compose up -d --build
# Nginx cài trên VPS (deploy/nginx.conf) nhận 80/443 rồi chuyển vào api/web.
# api và web chỉ mở cổng trên 127.0.0.1 nên bên ngoài không truy cập thẳng được;
# db/redis/worker không mở cổng nào, chỉ nói chuyện trong mạng nội bộ của Docker.

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  env_file: .env
  environment:
    LEADSCAN_DATABASE_URL: postgresql+psycopg://leadscan:${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}@db:5432/leadscan
    LEADSCAN_REDIS_URL: redis://redis:6379/0
    LEADSCAN_CLIENT_IP_HEADER: X-Real-IP
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: leadscan
      POSTGRES_USER: leadscan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadscan -d leadscan"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Chạy migration 1 lần mỗi lần deploy, xong thì thoát
  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8012}:8000"  # chỉ localhost — Nginx gọi vào /api/
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker", "worker", "-l", "info", "--concurrency", "2"]

  beat:
    <<: *backend
    command: ["celery", "-A", "app.worker", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://leadscan.net}
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3012}:3000"  # chỉ localhost — Nginx gọi vào /
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
